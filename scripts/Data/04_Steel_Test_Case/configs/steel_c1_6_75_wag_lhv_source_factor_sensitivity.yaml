      bof_lower_share: 0.503703704
      bof_upper_share: 0.503703704
    wag_lhv_mj_per_nm3_override:
      BFG: 3.85
      COG: 18.5
      BOFG: 8.6
    caveat: >-
      Sensitivity only: applies the consistent BF/KGF/BOF source-card LHV set
      to the energy represented by already modelled carrier volumes. It keeps
      source gas volumes, process heat demand, WAG eligibility, named NG
      backup, the 15-bar steam abstraction and all base development inputs
      unchanged. Its purpose is to test the known LHV-source inconsistency,
      not to fit annual anchors.
