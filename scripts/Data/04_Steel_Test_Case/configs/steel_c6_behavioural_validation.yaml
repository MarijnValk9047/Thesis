  annual_outage_active: false
  solver_seed: 0
  mip_gap_limit: 0.001
  economic_mip_gap_limit: 0.002
  integer_feasibility_tolerance: 1.0e-9
  solver_time_limit_seconds: 900
  output_policy: minimal
  path_feasibility_augmentation:
