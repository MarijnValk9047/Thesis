    parent_round_bridge_preservation_constraint_allowed: false
    parent_round_bridge_requires_full_expected_cost_resolve: true
    probability_allowed: false
    expected_cost_weight_allowed: false
    raw_shadow_price_transport_allowed: false
    final_test_period_source_allowed: false
    allowed_source_classes: [development_shadow, controlled_synthetic_validation]
    controlled_synthetic_profiles_frozen_before_solve: true
    controlled_synthetic_pattern_application_scope: same_profile_development_only
    exact_zero_imbalance_required: true
  forbidden_scope:
    D_plus_1_to_D_plus_4: true
    S30: true
    CVaR: true
    mFRR: true
    ETS: true
    export: true
    product_revenue: true
    emergency_import: true
    imbalance_optimisation: false
    annual_maintenance_or_outage: true
    annualisation: true

final_test_periods:
  - {role: high_volatility, start: '2024-11-04', end: '2024-11-10'}
  - {role: typical_winter, start: '2024-12-02', end: '2024-12-08'}
  - {role: high_prices, start: '2025-01-13', end: '2025-01-19'}
  - {role: typical_summer, start: '2025-07-14', end: '2025-07-20'}

shadow_selection:
  development_start: '2024-10-01'
  development_end: '2025-09-30'
  regime_order: [typical_calm, high_price, high_volatility, negative_low_price]
  minimum_pairwise_separation_days: 28
  final_period_buffer_days: 28
  require_previous_week_naive_outside_final_periods: true
  exclude_dst_days: true
  interpolation_allowed: false
  typical_feature_columns:
    - mean_price_eur_per_mwh
    - std_price_eur_per_mwh
    - iqr_price_eur_per_mwh
    - p05_p95_range_eur_per_mwh
    - mean_abs_ramp_eur_per_mwh
    - negative_qh_share
  volatility_feature_columns:
    - std_price_eur_per_mwh
    - iqr_price_eur_per_mwh
    - p05_p95_range_eur_per_mwh
    - mean_abs_ramp_eur_per_mwh
    - negative_qh_share
  high_price_decile: 0.90
  high_volatility_decile: 0.90

non_final_rolling_week:
  week_id: validation_week_2025-06-16
  week_start: '2025-06-16'
  week_end: '2025-06-22'
  selection_rule: earliest_complete_monday_sunday_after_three_frozen_shadow_sources
